# Netlify configuration — Aurelia/Grace Salon, Next.js 14 App Router.
#
# Netlify detects Next.js and auto-installs its OpenNext adapter (do NOT pin
# a version — Netlify updates it per build). The adapter provisions:
#   - a serverless function for SSR, route handlers (/api/**) and server actions
#   - an edge function for middleware.ts (HTTPS redirect, security headers, CSP)
# so there is intentionally NO publish directory and NO [[plugins]] block here.
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # These variable NAMES appear as plain words in README/docs/commit logs,
  # which was tripping Netlify's secrets scanner even though no real values
  # are committed. Omitting by key (not disabling scanning entirely) keeps
  # the scanner active for everything else.
  SECRETS_SCAN_OMIT_KEYS = "CRON_SECRET,DATABASE_URL,EMAILJS_OTP_TEMPLATE_ID"