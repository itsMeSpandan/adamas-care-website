# Netlify configuration — Adamas Care, Next.js 14 App Router.
#
# Netlify detects Next.js and auto-installs its OpenNext adapter (do NOT pin
# a version — Netlify updates it per build). The adapter provisions:
#   - a serverless function for SSR, route handlers (/api/**) and server actions
#   - an edge function for middleware.ts (HTTPS redirect, security headers, CSP)
# so there is intentionally NO publish directory and NO [[plugins]] block here.
# Docs: https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"

[build.environment]
  # firebase-admin / google-auth-library@11 / google-gax@6 declare
  # engines: node >= 22, so building on Node 20 emits unsupported-engine
  # warnings and pulls in older transitive code paths.
  NODE_VERSION = "22"
  # These variable NAMES appear as plain words in README/docs/commit logs,
  # which was tripping Netlify's secrets scanner even though no real values
  # are committed. Omitting by key (not disabling scanning entirely) keeps
  # the scanner active for everything else.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BASE_URL,FIREBASE_PROJECT_ID,EMAIL_FROM"

# Global security headers for all routes on Netlify
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://ui-avatars.com https://maps.googleapis.com https://maps.gstatic.com https://www.gstatic.com https://lh3.googleusercontent.com https://flagcdn.com https://res.cloudinary.com data: blob:; script-src 'self' 'sha256-Q+8tPsjVtiDsjF/Cv8FMOpg2Yg91oKFKDAJat1PPb2g=' 'strict-dynamic' https://maps.googleapis.com https://www.gstatic.com https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://maps.googleapis.com https://maps.gstatic.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://accounts.google.com https://www.googleapis.com https://apis.google.com https://www.google.com https://login.microsoftonline.com https://login.live.com; frame-src 'self' https://www.google.com https://maps.google.com https://accounts.google.com https://apis.google.com https://*.firebaseapp.com https://login.microsoftonline.com https://login.live.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Long-term immutable caching for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# security.txt served as plain text
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
